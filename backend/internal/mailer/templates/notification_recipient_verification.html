<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证推送收件邮箱 · {{brand}}</title>
</head>
<body style="margin:0;padding:0;background-color:#fafafa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',system-ui,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#fafafa;padding:40px 16px;">
        <tr><td align="center">
            <table width="560" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff;border:1px solid #e3e3e3;">
                <tr><td style="padding:22px 36px;border-bottom:1px solid #efefef;">
                    <table cellpadding="0" cellspacing="0" border="0"><tr>
                        <td style="vertical-align:middle;padding-right:12px;line-height:0;font-size:0;"><img src="cid:brand-mark" width="20" height="20" alt="" style="display:block;width:20px;height:20px;border:0;outline:none;text-decoration:none;"></td>
                        <td style="vertical-align:middle;"><p style="margin:0;font-size:13px;font-weight:600;color:#0a0a0a;letter-spacing:-0.025em;line-height:1.2;">{{brand}}</p></td>
                    </tr></table>
                </td></tr>
                <tr><td style="padding:36px 36px 28px;">
                    <p style="margin:0 0 14px;font-family:Consolas,'SF Mono',Menlo,monospace;font-size:10px;font-weight:500;letter-spacing:0.2em;color:#8e8e8e;">VERIFY RECIPIENT</p>
                    <p style="margin:0 0 10px;font-size:28px;font-weight:600;color:#0a0a0a;letter-spacing:-0.04em;line-height:1.15;">验证推送收件邮箱</p>
                    <p style="margin:0 0 28px;font-size:13.5px;color:#575757;line-height:1.65;">有人正在把此邮箱添加为{{brand}}的消息收件地址。请使用以下验证码确认邮箱归属，验证码有效期为 {{expire_minutes}} 分钟。</p>
                    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="border-top:1px solid #efefef;border-bottom:1px solid #efefef;"><tr><td style="padding:28px 0;text-align:center;">
                        <p style="margin:0 0 10px;font-family:Consolas,'SF Mono',Menlo,monospace;font-size:9.5px;font-weight:500;letter-spacing:0.16em;color:#8e8e8e;">CODE</p>
                        <p style="margin:0;font-family:Consolas,'SF Mono',Menlo,monospace;font-size:36px;font-weight:600;letter-spacing:0.28em;color:#d6001c;line-height:1.2;">{{code}}</p>
                    </td></tr></table>
                    <p style="margin:28px 0 10px;font-size:13px;color:#575757;line-height:1.65;">如非本人操作，请忽略本邮件；此地址不会被添加，也不会收到电费推送。</p>
                    <p style="margin:0;font-size:13px;color:#575757;line-height:1.65;">请勿将验证码告诉他人。</p>
                </td></tr>
                <tr><td style="padding:20px 36px 28px;border-top:1px solid #efefef;">
                    <p style="margin:0 0 10px;font-size:12.5px;color:#8e8e8e;line-height:1.5;">{{brand}}</p>
                    <p style="margin:0;font-size:12px;color:#8e8e8e;line-height:1.6;">如有疑问，可访问 <a href="{{base_url}}" style="color:#d6001c;text-decoration:none;">{{base_url}}</a></p>
                </td></tr>
            </table>
        </td></tr>
    </table>
</body>
</html>
