openapi: 3.1.0
info:
  title: EDU Power Push Backend API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    API for campus electricity scanning, product user accounts, personal and
    campus statistics, push notifications, and the operator admin panel.
    Processes bind to loopback by default (Compose maps only 127.0.0.1). Public
    access is same-origin reverse proxy + TLS; operators may also use an SSH
    tunnel. Campus aggregates (`/api/v1/campus/*`) are anonymous; personal data
    uses short-lived access JWTs; admin and raw meter endpoints require an
    operator/admin session or `ADMIN_TOKEN` (never ship that token in a browser build).
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
tags:
  - name: System
    description: Process and dependency health.
  - name: Inventory
    description: Manual room-to-meter inventory validation and querying.
  - name: Meters
    description: Internal per-meter balance, usage, and bill data.
  - name: Campus
    description: >
      Campus, building, and floor aggregates for the product frontend. Building 16 is retained
      in operational storage and scanning but is excluded from every product aggregate because
      it is not currently billed through this platform.
  - name: Operations
    description: Internal scan runs, progress, results, and data anomalies.
  - name: Mail
    description: Internal notification-provider testing.
  - name: Auth
    description: Product-user email/password authentication and rotating JWT sessions.
  - name: Users
    description: Product-user profile and meter binding.
  - name: Frontend
    description: Non-secret product feature flags and display configuration.
  - name: Admin
    description: >
      Web admin panel. Authorised by account role (operator/admin) checked per request, or by
      ADMIN_TOKEN for machines. See docs/ADMIN-PANEL.md.

paths:
  /health/live:
    get:
      tags: [System]
      operationId: getLiveness
      summary: Check whether the API process is alive
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "400":
          $ref: "#/components/responses/BadRequest"

  /health/ready:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Check database, migrations, and worker heartbeat
      security: []
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/frontend-config:
    get:
      tags: [Frontend]
      operationId: getFrontendConfig
      summary: Get non-secret product feature flags and display configuration
      security: []
      responses:
        "200":
          description: Current frontend configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrontendConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/captcha/config:
    get:
      tags: [Frontend]
      operationId: getCaptchaConfig
      summary: Get the active public human-verification configuration
      description: Returns no provider secret. Clients use the action list to decide where a challenge is required.
      security: []
      responses:
        "200":
          description: Public CAPTCHA configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptchaPublicConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/register/code:
    post:
      tags: [Auth]
      operationId: requestRegistrationCode
      summary: Send a short-lived email verification code for registration
      security: []
      parameters:
        - $ref: "#/components/parameters/CaptchaToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "204":
          description: Verification code sent
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Email is already registered; the user should sign in instead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: Mail provider failed to deliver
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Register an email/password account and claim an eligible inventory meter
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account and session created; the rotating refresh JWT is set as an HttpOnly cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Email is already registered or the meter is bound to another account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: Authenticate with email and password
      security: []
      parameters:
        - $ref: "#/components/parameters/CaptchaToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Access JWT returned and rotating refresh JWT set as an HttpOnly cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CaptchaRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/oauth/{provider}/start:
    get:
      tags: [Auth]
      operationId: startOAuthLogin
      summary: Redirect the browser to Google or GitHub for authorization
      description: >
        Top-level navigation, not fetch: the response is always a 302. Failures redirect
        back to the site with `?oauth_error=<reason>` instead of returning JSON, because a
        JSON body would be rendered as the page the user is looking at. Stores the flow
        state and PKCE verifier in a short-lived `SameSite=Lax` cookie.
      security: []
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
        - name: next
          in: query
          required: false
          description: Same-site path to return to; anything else falls back to `/`
          schema: { type: string, maxLength: 200 }
      responses:
        "302":
          description: Redirect to the provider, or back to the site carrying `oauth_error`
          headers:
            Location:
              schema: { type: string }
            Set-Cookie:
              schema: { type: string }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/oauth/{provider}/callback:
    get:
      tags: [Auth]
      operationId: completeOAuthLogin
      summary: Complete the authorization-code exchange and open a session
      description: >
        Verifies the state cookie, exchanges the code, then links the provider identity to
        an account (matching by *verified* email) or creates one. On success it sets the
        refresh cookie only and redirects to `next` with `?oauth=<provider>&oauth_result=`
        `created|linked|signed_in`; the SPA then calls `/api/v1/auth/refresh` for its access
        token. The access token is never placed in the URL. Failures redirect with
        `oauth_error` set to one of `denied`, `state`, `exchange`, `email_missing`,
        `email_unverified`, `registration_disabled`, `conflict`, `account_disabled`,
        `disabled_entry`, `unavailable`.
      security: []
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          description: Set by the provider when the user cancels or authorization is refused
          schema: { type: string }
      responses:
        "302":
          description: Redirect back to the site; the refresh cookie is set only on success
          headers:
            Location:
              schema: { type: string }
            Set-Cookie:
              schema: { type: string }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshUserToken
      summary: Rotate the refresh JWT and issue a new access JWT
      security:
        - refreshCookie: []
      responses:
        "200":
          description: Refresh session rotated
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Refresh token invalid, expired, revoked, or reused; reuse revokes its session family
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logoutUser
      summary: Revoke the current refresh-token family and clear its cookie
      security:
        - refreshCookie: []
      responses:
        "204":
          description: Session revoked or already absent
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/password/forgot:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Send a password-reset code; always 204 to prevent account enumeration
      security: []
      parameters:
        - $ref: "#/components/parameters/CaptchaToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "204":
          description: Accepted regardless of account existence, resend state, or asynchronous delivery outcome
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/CaptchaRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Reset the password with an emailed code and revoke all sessions
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, password]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
                code: { type: string, pattern: "^[0-9]{6}$" }
                password: { type: string, format: password, minLength: 8, maxLength: 128 }
      responses:
        "204":
          description: Password reset; all refresh-token families and their access tokens revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Get the authenticated user and active meter binding
      security:
        - userAccessToken: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Users]
      operationId: deleteCurrentUser
      summary: Delete the authenticated account
      description: >
        注销账号。需要当前密码：不可逆动作，只有一个未过期的 access token 不够。

        随账号一起删除的是账号自己的东西 —— 绑表记录、会话、榜单偏好、
        推送规则与渠道（含密文）、推送日志；删掉绑表记录顺带把电表放开，
        这间宿舍换人住之后才绑得上。

        电表读数 / 差值 / 月账单挂在电表上，属于全校用电的底账，一行都不动。

        最后一个 admin 账号不许注销（409 last_admin）：面板会没人进得去。
      security:
        - userAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        "204":
          description: Account deleted; the refresh cookie is cleared
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The last admin account cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/me/meter:
    put:
      tags: [Users]
      operationId: rebindCurrentUserMeter
      summary: Replace the authenticated user's active meter binding
      security:
        - userAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [meter]
              additionalProperties: false
              properties:
                meter:
                  type: string
                  pattern: "^[0-9]{6,32}$"
      responses:
        "200":
          description: Updated user and meter binding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Meter is bound to another account or its building is not served by this platform
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/me/meter/preview:
    get:
      tags: [Users]
      operationId: previewMeterForBinding
      summary: Location preview for meter confirmation before binding
      description: >
        Lets a signed-in user verify a dormitory address before committing a binding.
        Never includes balance or any reading; the meter does not belong to the caller yet.
        Rate limited per user rather than per IP.
      security:
        - userAccessToken: []
      parameters:
        - $ref: "#/components/parameters/CaptchaToken"
        - name: meter
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9]{6,32}$"
      responses:
        "200":
          description: Location and claimability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeterPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CaptchaRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/me/leaderboard:
    get:
      tags: [Users]
      operationId: getCurrentUserLeaderboardPreference
      summary: Get leaderboard participation and identity masking
      security:
        - userAccessToken: []
      responses:
        "200":
          description: Current preference, or the defaults when the user has never saved one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardPreference"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Users]
      operationId: updateCurrentUserLeaderboardPreference
      summary: Update leaderboard participation and identity masking
      description: >
        Partial update: omitted fields keep their current value, so a client that does not know
        about a newer field cannot silently reset it.
      security:
        - userAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                opted_in: { type: boolean }
                show_building: { type: boolean }
                show_floor: { type: boolean }
                show_room: { type: boolean }
                show_nickname: { type: boolean }
                mask_building: { type: boolean }
                mask_floor: { type: boolean }
                mask_room: { type: boolean }
      responses:
        "200":
          description: Saved preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardPreference"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me/profile:
    put:
      tags: [Users]
      operationId: updateCurrentUserProfile
      summary: Update nickname
      security:
        - userAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              additionalProperties: false
              properties:
                nickname: { type: string, maxLength: 80 }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me/password:
    put:
      tags: [Users]
      operationId: changeCurrentUserPassword
      summary: Change password; revokes all sessions
      security:
        - userAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              additionalProperties: false
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 8, maxLength: 128 }
      responses:
        "204":
          description: Password changed; all sessions revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me/email/code:
    post:
      tags: [Users]
      operationId: requestEmailChangeCode
      summary: Send verification code to a new email address
      security:
        - userAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "204":
          description: Code sent
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/me/email:
    put:
      tags: [Users]
      operationId: changeCurrentUserEmail
      summary: Change login email with code and current password
      security:
        - userAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, password]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
                code: { type: string, pattern: "^[0-9]{6}$" }
                password: { type: string, format: password }
      responses:
        "200":
          description: Email updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/me/channels/mail/recipient/code:
    post:
      tags: [Users]
      operationId: requestMailRecipientCode
      summary: Send a verification code before adding a notification recipient
      security:
        - userAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "204":
          description: Code sent to the prospective recipient
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/me/channels/mail/recipient/verify:
    post:
      tags: [Users]
      operationId: verifyMailRecipient
      summary: Verify ownership of an additional notification recipient
      security:
        - userAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: Recipient verified for the current user
          content:
            application/json:
              schema:
                type: object
                required: [email]
                additionalProperties: false
                properties:
                  email: { type: string, format: email }
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/me/channels:
    get:
      tags: [Users]
      operationId: listCurrentUserChannels
      summary: List notification channel configurations (secrets masked)
      security:
        - userAccessToken: []
      responses:
        "200":
          description: Channel configurations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Users]
      operationId: replaceCurrentUserChannels
      summary: Bulk update notification channel configurations
      security:
        - userAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelList"
      responses:
        "200":
          description: Updated configurations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/me/channels/{channel}:
    put:
      tags: [Users]
      operationId: updateCurrentUserChannel
      summary: Update one notification channel; omitted secret fields keep their stored value
      security:
        - userAccessToken: []
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelUpdate"
      responses:
        "200":
          description: Updated channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/me/channels/{channel}/test:
    post:
      tags: [Users]
      operationId: testCurrentUserChannel
      summary: Send current balance, data time, location, and meter ID through a configured channel, even when delivery is disabled
      security:
        - userAccessToken: []
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: Delivery attempted; see status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelTestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Channel is unavailable, unsupported, or has no saved configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/me/notification-settings:
    get:
      tags: [Users]
      operationId: getCurrentUserNotificationSettings
      summary: Get low-balance alert and scheduled digest rules
      security:
        - userAccessToken: []
