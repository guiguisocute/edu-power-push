            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryValidation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/inventory/tree:
    get:
      tags: [Inventory]
      operationId: getInventoryTree
      summary: Get campus, building, floor, and room hierarchy
      parameters:
        - name: include_excluded
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Inventory tree and coverage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryTree"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/meters/{meter}/overview:
    get:
      tags: [Meters]
      operationId: getMeterOverview
      summary: Get latest balance and recent consumption summary for a meter
      parameters:
        - $ref: "#/components/parameters/Meter"
      responses:
        "200":
          description: Meter overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeterOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/meters/{meter}/refresh:
    post:
      tags: [Meters]
      operationId: refreshMeter
      summary: Fetch and store one on-demand upstream reading for a meter
      parameters:
        - $ref: "#/components/parameters/Meter"
      responses:
        "200":
          description: Refresh attempted; inspect status for refreshed, cached, or degraded outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeterRefresh"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/meters/{meter}/series:
    get:
      tags: [Meters]
      operationId: getMeterSeries
      summary: Get balance or consumption series for a meter
      parameters:
        - $ref: "#/components/parameters/Meter"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Granularity"
        - name: metric
          in: query
          required: true
          schema:
            type: string
            enum: [balance, consumption]
      responses:
        "200":
          description: Meter series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeSeries"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/meters/{meter}/bills:
    get:
      tags: [Meters]
      operationId: listMeterBills
      summary: List monthly bills already collected for a meter
      parameters:
        - $ref: "#/components/parameters/Meter"
        - name: from_month
          in: query
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}$"
        - name: to_month
          in: query
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}$"
      responses:
        "200":
          description: Monthly bills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyBill"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/campus/scopes:
    get:
      tags: [Campus]
      operationId: getCampusScopes
      summary: Lightweight campus, building, and floor list for frontend filters
      description: >
        Contains only buildings and floors that hold eligible (active, not excluded) meters,
        which is the same denominator campus/series and campus/rankings use, so every option
        returns data. Buildings not currently billed through this platform (currently Building 16)
        are omitted even though their meters continue to be scanned and stored. Floor strings are
        byte-identical to the building/floor query parameters.
      security: []
      responses:
        "200":
          description: Scope tree limited to buildings and floors with eligible meters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampusScopes"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/campus/summary:
    get:
      tags: [Campus]
      operationId: getCampusSummary
      summary: Get aggregate electricity summary for a campus scope
      security: []
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Building"
        - $ref: "#/components/parameters/Floor"
      responses:
        "200":
          description: Campus summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampusSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/campus/series:
    get:
      tags: [Campus]
      operationId: getCampusSeries
      summary: Get aggregate day, week, or month series
      security: []
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Granularity"
        - $ref: "#/components/parameters/Building"
        - $ref: "#/components/parameters/Floor"
      responses:
        "200":
          description: Aggregate series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeSeries"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/campus/rankings:
    get:
      tags: [Campus]
      operationId: getCampusRankings
      summary: Get period rankings using interval consumption, never cumulative kWh
      description: >
        Semi-static completed-period rankings. Day switches daily, week switches Monday, and month
        switches on the first day at display.ranking_refresh_time (APP_TIMEZONE; default 09:00).
        Responses are held in an account-isolated server cache until the next scheduled switch.
      security: []
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            enum: [day, week, month]
        - name: mode
          in: query
          required: true
          schema:
            type: string
            enum: [usage, saving, surge, drop]
        - $ref: "#/components/parameters/Building"
        - $ref: "#/components/parameters/Floor"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Ranking result
          headers:
            X-Ranking-Cache:
              description: HIT when served without recomputing the ranking query; MISS on the first request for a cache key.
              schema:
                type: string
                enum: [HIT, MISS]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ranking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/campus/breakdown:
    get:
      tags: [Campus]
      operationId: getCampusBreakdown
      summary: Consumption matrix by building (or by floor within one building) over time
      description: >
        One query feeds two views: row totals drive the consumption mix, and the row-by-bucket
        cells drive the heatmap. The grouping dimension follows the scope — without `building`
        it groups by building, with `building` it groups by that building's floors. Splitting by
        building *type* (dormitory / teaching / lab) is not offered: the inventory only contains
        dormitory meters, so any such split would be invented.
      security: []
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: granularity
          in: query
          schema:
            type: string
            enum: [day, week, month]
            default: day
        - $ref: "#/components/parameters/Building"
      responses:
        "200":
          description: Consumption matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampusBreakdown"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/campus/bills:
    get:
      tags: [Campus]
      operationId: getCampusBills
      summary: Campus-wide monthly consumption from official bills
      description: >
        Monthly totals sourced from `monthly_bills` — the upstream's official figures. Daily
        series use the separate official `electricdetail` feed for settled natural days and fall
        back to scan-derived estimates only for the not-yet-settled current day. The monthly feed
        remains an independent reconciliation source and records upstream restatements.


        Kept as a separate endpoint from `/campus/series` because the granularity differs
        (month vs day), not because the two are equally trustworthy — plotting them on one line
        would suggest they can be compared point by point. Bills are re-fetched continuously by
        the biller (`BILL_CRON`, daily from the 2nd) and upstream restatements are recorded in
        `bill_revisions`.
      security: []
      parameters:
        - name: from_month
          in: query
          description: Inclusive lower bound, `YYYY-MM`. Omit for no lower bound.
          schema:
            type: string
            pattern: '^[0-9]{4}-[0-9]{2}$'
        - name: to_month
          in: query
          description: Inclusive upper bound, `YYYY-MM`. Omit for no upper bound.
          schema:
            type: string
            pattern: '^[0-9]{4}-[0-9]{2}$'
        - $ref: "#/components/parameters/Building"
      responses:
        "200":
          description: Monthly campus consumption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampusBills"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/campus/hourly-heatmap:
    get:
      tags: [Campus]
      operationId: getCampusHourlyHeatmap
      summary: Reserved hourly heatmap contract
      description: Returns unavailable until a reliable hourly upstream source exists.
      security: []
      responses:
        "200":
          description: Explicitly unavailable capability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnavailableCapability"
              examples:
                unavailable:
                  value:
                    availability: unavailable
                    reason_code: upstream_hourly_data_unavailable
                    message: Reliable hourly electricity data is not available from the upstream source.
                    quality:
                      eligible: 0
                      covered: 0
                      coverage_ratio: 0
                      stale: 0
                      anomalies: 0
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/mail/test:
    post:
      tags: [Mail]
      operationId: sendTestMail
      summary: Send one test email through the configured provider
      description: >
        With no template this sends a plain connectivity check. With a template it renders that
        product template with sample data, so operators can verify layout and placeholders
        without waiting for a real push.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient]
              properties:
                recipient:
                  type: string
                  format: email
                template:
                  type: string
                  enum: ["", balance_alert, usage_summary, verification_code, password_reset, push_test, meter_unbound, account_disabled, account_deleted]
                  default: ""
      responses:
        "202":
          description: Delivery accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailDelivery"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Configured mail provider rejected or failed the delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/admin/frontend-config:
    put:
      tags: [Frontend]
      operationId: updateFrontendConfig
      summary: Replace product feature flags and record an audit version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrontendConfigUpdate"
      responses:
        "200":
          description: Configuration updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrontendConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ---- Web 管理面板 -------------------------------------------------------
  # 这些端点接受两种凭证：具备 operator/admin 角色的用户 access JWT（人），
  # 或 ADMIN_TOKEN（机器）。角色每次请求现查库，降权立刻生效。
  # 401 = 没表明身份；403 = 表明了但级别不够。

  /api/v1/admin/session:
    get:
      tags: [Admin]
      operationId: getAdminSession
      summary: Who am I, and what can this deployment do
      security: [{ userAccessToken: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Current actor and panel capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/audit:
    get:
      tags: [Admin]
      operationId: listAdminAudit
      summary: Recent panel writes
      description: Credential changes record which fields changed, never their values.
      security: [{ userAccessToken: [] }, { bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Audit entries, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/users:
    get:
      tags: [Admin]
      operationId: listAdminUsers
      summary: Account list for the panel
      description: The q parameter matches email, nickname and meter number at once.
      security: [{ userAccessToken: [] }, { bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: role
          in: query
          schema: { type: string, enum: [user, operator, admin] }
        - name: status
          in: query
          schema: { type: string, enum: [active, disabled] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminUser"
                  total:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/users/promote:
    post:
      tags: [Admin]
      operationId: promoteAdminUser
      summary: Bootstrap the first administrator
      description: >
        Accepts only ADMIN_TOKEN. With no admin in the database the session channel cannot get
        in, so there has to be some way to create the first one. Afterwards use PATCH
        /api/v1/admin/users/{user_id}.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  description: Must already be a registered account.
                role:
                  type: string
                  enum: [user, operator, admin]
                  default: admin
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/users/{user_id}:
    patch:
      tags: [Admin]
      operationId: updateAdminUser
      summary: Change a role or enable/disable an account
      description: >
        Requires admin, because whoever can grant access is effectively an administrator.
        Disabling also revokes that account's sessions. Demoting or disabling the last active
        admin is rejected, as is changing your own role or status.
      security: [{ userAccessToken: [] }, { bearerAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [user, operator, admin]
                status:
                  type: string
                  enum: [active, disabled]
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Would lock everyone out (last_admin) or lock yourself out (self_lockout)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Admin]
      operationId: deleteAdminUser
      summary: Permanently delete an account
      description: >
        Requires admin. Deletes account-owned bindings, sessions, notification settings,
        channel credentials and push logs through cascading foreign keys. Meter readings,
        official daily usage and bills remain intact. Deleting yourself or the last active
        administrator is rejected.
      security: [{ userAccessToken: [] }, { bearerAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Account deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Would delete the caller or the last active administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/users/{user_id}/meter:
    delete:
      tags: [Admin]
      operationId: unbindAdminUserMeter
      summary: Clear an account's active meter binding
      description: >
        Requires admin. This only closes the current user-meter binding. Historical meter
        readings, official daily usage and bills are retained.
      security: [{ userAccessToken: [] }, { bearerAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Binding cleared, including when it was already empty
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/users/{user_id}/sessions/revoke:
    post:
      tags: [Admin]
      operationId: revokeAdminUserSessions
      summary: Sign an account out everywhere
      description: Gentler than disabling, because the user can simply sign in again.
      security: [{ userAccessToken: [] }, { bearerAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Number of revoked sessions
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/settings/school:
    get:
      tags: [Admin]
      operationId: getSchoolSettings
      summary: Which school the collectors target
      description: >
        Lists every registered upstream provider with the schools it is known to support,
        plus the binding currently in effect. `configured: false` means no school has been
        selected: the service runs normally but every collector skips its runs.
      security: [{ userAccessToken: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Available providers and the active binding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolSettingsView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Admin]
      operationId: putSchoolSettings
      summary: Select the school the collectors target
      description: >
        Takes effect within about 15 seconds without a restart. A run already in progress keeps
        the querier it started with, so a single run never mixes two schools. An empty `area_id`
        is a valid request: it stops collection until a school is selected again. An `area_id`
        outside the provider's tested list is accepted, because that list is a test result rather
        than an allow list.
      security: [{ userAccessToken: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolBinding"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolSettingsView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/settings/scanner:
    get:
      tags: [Admin]
      operationId: getScannerSettings
      summary: Scanner schedule and throttle
      security: [{ userAccessToken: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Current settings, their source, and the server-side ceilings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScannerSettingsView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Admin]
      operationId: putScannerSettings
      summary: Update the scanner schedule and throttle
      description: >
        Each scanner keeps its environment-defined safety ceiling. Balance, bill, and daily-detail
        runs may overlap, while every outbound request also shares the environment-defined global
        QPS and concurrency gate.
      security: [{ userAccessToken: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScannerSettings"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScannerSettingsView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/settings/mail:
    get:
      tags: [Admin]
      operationId: getMailSettings
      summary: Mail provider configuration
      description: >
        Plaintext fields come back as-is; credentials come back only as a masked value plus a
        boolean saying whether they are set. Requires admin.
      security: [{ userAccessToken: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Effective configuration and what is still missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailSettingsView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Admin]
      operationId: putMailSettings
      summary: Save mail provider configuration; takes effect on the next send
      description: >
        Credentials are three-state: an omitted field keeps the stored value, an explicit null
        clears it (falling back to environment variables), and a string stores a new value.
        Values that still contain the mask are ignored, so a panel can render the masked string
        straight into the input without risking storing it back.
        Returns 412 when SETTINGS_ENCRYPTION_KEY is absent, because refusing beats silently
        storing an API key in plaintext.
      security: [{ userAccessToken: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings:
                  $ref: "#/components/schemas/MailSettings"
                secrets:
                  type: object
                  additionalProperties:
                    type: [string, "null"]
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailSettingsView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          description: Server has no SETTINGS_ENCRYPTION_KEY, so credentials cannot be stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/settings/mail/test:
    post:
      tags: [Admin]
      operationId: testMailSettings
      summary: Send one real email with the saved configuration
      description: >
        Uses the configuration already saved on the server, not an unsubmitted draft, so save
        before testing. A delivery failure returns 200 with ok=false: that is a report of an
        attempt, not a server fault.
      security: [{ userAccessToken: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, format: email }
      responses:
        "200":
          description: Attempt result
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  error: { type: string }
                  delivery:
                    $ref: "#/components/schemas/MailDelivery"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/admin/settings/oauth:
    get:
      tags: [Admin]
      operationId: getOAuthSettings
      summary: Get the effective third-party login credentials and their redirect URIs
      description: >
        Client secrets are returned masked, never in clear. `settings` holds the values in
        force after merging the panel record over the environment fallback, so the panel can
        render exactly what is running. `redirect_uris` is computed server-side because
        mistyping that line in the provider console is the most common failure of this setup.
      security: [{ userAccessToken: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Effective configuration with masked secret state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthSettingsView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Admin]
      operationId: putOAuthSettings
      summary: Save third-party login credentials
      description: >
        Secret fields are three-state: omit to keep the stored value, send null or an empty
        string to clear it back to the environment fallback, or send a new string to replace
        it. A masked value round-tripped unchanged is ignored. Takes effect without a restart.
        Storing credentials requires SETTINGS_ENCRYPTION_KEY (HTTP 412 otherwise). A provider
        configured with only one half of its credential pair is rejected with HTTP 400
        `oauth_not_configured`, since the symptom would otherwise be a silently missing button.
      security: [{ userAccessToken: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              additionalProperties: false
              properties:
                settings:
                  $ref: "#/components/schemas/OAuthSettings"
                secrets:
                  type: object
                  additionalProperties: false
                  properties:
                    google_client_secret: { type: [string, "null"] }
                    github_client_secret: { type: [string, "null"] }
      responses:
        "200":
          description: Saved configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthSettingsView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          description: SETTINGS_ENCRYPTION_KEY is not configured, so credentials cannot be stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/settings/captcha:
    get:
      tags: [Admin]
      operationId: getCaptchaSettings
      summary: Get the effective human-verification provider and protected actions
      security: [{ userAccessToken: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Effective configuration with masked secret state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptchaSettingsView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Admin]
      operationId: putCaptchaSettings
      summary: Save the provider and action-level human-verification policy
      description: >
        Secret fields are three-state: omit to keep the stored value, send null or an empty
        string to clear it, or send a new string to replace it. Provider changes take effect
        without restarting the API. Stored credentials require SETTINGS_ENCRYPTION_KEY.
      security: [{ userAccessToken: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              additionalProperties: false
              properties:
                settings:
                  $ref: "#/components/schemas/CaptchaSettings"
                secrets:
                  type: object
                  properties:
                    turnstile_secret: { type: [string, "null"] }
                  additionalProperties: false
      responses:
        "200":
          description: Saved configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptchaSettingsView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          description: Server has no SETTINGS_ENCRYPTION_KEY, so credentials cannot be stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/settings/captcha/test:
    post:
      tags: [Admin]
      operationId: testCaptchaSettings
      summary: Probe the currently saved human-verification provider
      description: Turnstile accepts a fresh widget token and verifies it through Siteverify.
      security: [{ userAccessToken: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                token:
                  type: string
                  description: Fresh Turnstile token.
      responses:
        "200":
          description: Provider reachability and verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptchaProbeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/me/sessions/revoke:
    post:
      tags: [Auth]
      operationId: revokeCurrentUserSessions
      summary: Sign out of every device, without changing the password
      description: >
        The most direct thing a user can do when they suspect someone else is signed in as them.
        Revokes this device too, so the client should return to the signed-out state.
      security: [{ userAccessToken: [] }]
      responses:
        "200":
          description: Number of revoked sessions
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Internal administrator token from ADMIN_TOKEN.
    userAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived product-user access JWT.
    refreshCookie:
      type: apiKey
      in: cookie
      name: edu_power_refresh
      description: Long-lived rotating refresh JWT stored as an HttpOnly SameSite cookie.

  parameters:
    CaptchaToken:
      name: X-Captcha-Token
      in: header
      required: false
      description: Fresh Turnstile token for a protected action.
      schema:
        type: string
    OAuthProvider:
      name: provider
      in: path
      required: true
      description: Third-party login provider.
      schema:
        type: string
        enum: [google, github]
    RunID:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Meter:
      name: meter
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    ChannelId:
      name: channel
      in: path
      required: true
      schema:
        type: string
        enum: [mail, sms, dingtalk, wecom, wecom_webhook, feishu, lark, discord, webhook, bark, gotify, whatsapp, pushplus, serverchan_turbo, serverchan3, mp, qq, napcat, telegram]
    From:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time
    Granularity:
      name: granularity
      in: query
      required: true
      schema:
        type: string
        enum: [day, week, month]
    Building:
      name: building
      in: query
      schema:
        type: string
    Floor:
      name: floor
      in: query
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid administrator token, access JWT, or refresh JWT
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated operation is disabled by product policy
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CaptchaRequired:
      description: Human verification is required or the supplied proof is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required dependency is not ready
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Request rate or resource-specific cooldown exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    CaptchaProvider:
      type: string
      enum: [disabled, turnstile]

    CaptchaAction:
      type: string
      enum: [auth.login, auth.register_code, auth.password_reset_code, meter.preview]

    CaptchaSettings:
      type: object
      additionalProperties: false
      required: [provider, site_key, hostname, actions]
      properties:
        provider:
          $ref: "#/components/schemas/CaptchaProvider"
        site_key:
          type: string
          description: Public Turnstile widget key; unused when verification is disabled.
        hostname:
          type: string
          description: Optional hostname required in a successful Turnstile verification response.
        actions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CaptchaAction"

    CaptchaPublicConfig:
      type: object
      additionalProperties: false
      required: [provider, site_key, actions]
      properties:
        provider:
          $ref: "#/components/schemas/CaptchaProvider"
        site_key: { type: string }
        actions:
          type: array
          items:
            $ref: "#/components/schemas/CaptchaAction"

    OAuthSettings:
      type: object
      additionalProperties: false
      description: >
        Plaintext half of the third-party login configuration. Client secrets are not part of
        it; they are written through the separate three-state `secrets` object and only ever
        read back masked. An empty field falls back to the matching environment variable.
      properties:
        base_url:
          type: string
          description: Site origin the redirect URI is built from; no path, no trailing slash.
          maxLength: 255
        google_client_id: { type: string, maxLength: 255 }
        github_client_id: { type: string, maxLength: 255 }

    OAuthSettingsView:
      type: object
      required:
        [settings, source, redirect_uris, configured, missing, secret_set, secret_masked,
         secrets_writable, secrets_unreadable, env_base_url, updated_at, updated_by]
      properties:
        settings:
          $ref: "#/components/schemas/OAuthSettings"
        source: { type: string, enum: [env, panel] }
        redirect_uris:
          type: object
          description: Exact callback URL to register with each provider; empty when no base URL is set.
          additionalProperties: { type: string }
        configured:
          type: object
          additionalProperties: { type: boolean }
        missing:
          type: object
          description: Per provider, which of base_url / client id / client secret is still absent.
          additionalProperties:
            type: array
            items: { type: string }
        secret_set:
          type: object
          additionalProperties: { type: boolean }
        secret_masked:
          type: object
          additionalProperties: { type: string }
        secrets_writable: { type: boolean }
        secrets_unreadable: { type: boolean }
        env_base_url:
          type: string
          description: Environment fallback for base_url, shown so the panel can say where an empty field lands.
        updated_at: { type: [string, "null"], format: date-time }
        updated_by: { type: string }

    CaptchaSettingsView:
      type: object
      required:
        [settings, source, providers, protected_actions, secret_set, secret_masked,
         secrets_writable, secrets_unreadable, missing, ready, updated_at, updated_by]
      properties:
        settings:
          $ref: "#/components/schemas/CaptchaSettings"
        source: { type: string, enum: [env, panel] }
        providers:
          type: array
          items:
            $ref: "#/components/schemas/CaptchaProvider"
        protected_actions:
          type: array
          items:
            $ref: "#/components/schemas/CaptchaAction"
        secret_set:
          type: object
          additionalProperties: { type: boolean }
        secret_masked:
          type: object
          additionalProperties: { type: string }
        secrets_writable: { type: boolean }
        secrets_unreadable: { type: boolean }
        missing:
          type: array
          items: { type: string }
        ready: { type: boolean }
        updated_at: { type: [string, "null"], format: date-time }
        updated_by: { type: string }

    CaptchaProbeResult:
      type: object
      required: [provider, available, passed]
      properties:
        provider:
          $ref: "#/components/schemas/CaptchaProvider"
        available: { type: boolean }
        passed: { type: boolean }

    FrontendAuthFeatures:
      type: object
      additionalProperties: false
      required: [email_login, sms_login, email_code, sms_code, registration]
      properties:
        email_login:
          type: boolean
        sms_login:
          type: boolean
        email_code:
          type: boolean
        sms_code:
          type: boolean
        registration:
          type: boolean
        google_oauth:
          type: boolean
          description: >
            Whether the "sign in with Google" entry is shown. Whether it *works* is a
            separate, server-side fact reported read-only in `oauth`.
        github_oauth:
          type: boolean
          description: Whether the "sign in with GitHub" entry is shown.

    FrontendFeatures:
      type: object
      additionalProperties: false
      required: [auth, channels]
      properties:
        auth:
          $ref: "#/components/schemas/FrontendAuthFeatures"
        channels:
          type: object
          description: Per-channel user-interface visibility; false hides the channel and disables existing delivery.
          additionalProperties:
            type: boolean
        channel_coming_soon:
          type: object
          description: Per-channel Coming Soon state; true keeps the row visible but disables configuration and existing delivery.
          additionalProperties:
            type: boolean
        channel_order:
          type: array
          description: User-facing channel order. Missing known channels are appended automatically.
          uniqueItems: true
          items:
            type: string
            enum: [mail, sms, dingtalk, wecom, wecom_webhook, feishu, lark, discord, webhook, bark, gotify, whatsapp, pushplus, serverchan_turbo, serverchan3, mp, qq, napcat, telegram]
        channel_categories:
          type: array
          description: >-
            User-facing channel groups, rendered in this order. Each channel may belong to at most
            one category; channels left out of every category are shown in a trailing "other" group.
            Order inside a group still comes from channel_order.
          maxItems: 12
          items:
            $ref: "#/components/schemas/FrontendChannelCategory"

    FrontendChannelCategory:
      type: object
      additionalProperties: false
      required: [id, name, en, channels]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,31}$"
          description: 配置里的稳定键；改标题不影响成员关系。
          examples: ["essentials"]
        name:
          type: string
          minLength: 1
          maxLength: 40
          examples: ["开箱即用"]
        en:
          type: string
          maxLength: 40
          description: 分组标题上方的等宽小标签。
          examples: ["READY TO USE"]
        desc:
          type: string
          maxLength: 160
          description: 一句话说明这一类渠道需要用户做什么。
        channels:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [mail, sms, dingtalk, wecom, wecom_webhook, feishu, lark, discord, webhook, bark, gotify, whatsapp, pushplus, serverchan_turbo, serverchan3, mp, qq, napcat, telegram]

    FrontendSemester:
      type: object
      additionalProperties: false
      required: [key, start, end]
      properties:
        key:
          type: string
          pattern: "^[0-9]{4}-(?:0[1-9]|1[0-2])$"
          description: 开学的年月；用户端显示为「2026-03学期」。
          examples: ["2026-03"]
        start:
          type: string
          format: date
          description: 第 1 周的第一天（本地日期）。必须落在 key 所指的那个月里。
        end:
          type: string
          format: date
          description: 学期最后一天（含）。start 到 end 至少 7 天、至多 300 天。

    FrontendDisplay:
      type: object
      additionalProperties: false
      required: [campus_name]
      properties:
        electricity_rate:
          type: string
          pattern: "^[0-9]+(?:\\.[0-9]{1,4})?$"
        empty_room_threshold_kwh:
          type: string
          pattern: "^[0-9]+(?:\\.[0-9]{1,4})?$"
          default: "0.3"
          description: >
            每个自然日都用该日官方用量（ydl）独立判定；低于该值时仅该日视为空房。空房不计入户均除数，
            也不参与省电榜；总用电量及其他榜单仍保留。允许范围为 (0, 10] kWh。
        ranking_refresh_time:
          type: string
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
          default: "09:00"
          description: 日榜每日、周榜周一、月榜每月 1 日切换到上一完整周期的 APP_TIMEZONE 本地时刻。
        campus_name:
          type: string
          minLength: 1
          maxLength: 120
        area_name:
          type: string
          maxLength: 120
          description: >
            School name shown in the sidebar and page title. May be empty: a
            multi-school deployment does not necessarily want one school's name
            in its header.
        brand_name:
          type: string
          maxLength: 120
          default: POWER·PUSH
          description: >
            Site name used in the sidebar, the tab title, and every outgoing mail.
            Kept separate from `area_name` because "which school" and "what this
            site is called" are not the same thing.
        semesters:
          type: array
          maxItems: 40
          description: |
            Academic calendar driving the client's "semester" chart: the x axis is
            week 1 … week N, where N is how many 7-day blocks fit between `start`
            and `end`. Entries must not overlap and each `key` must be the calendar
            month its `start` falls in. An empty list makes clients fall back to a
            rolling 18-week window.
          items:
            $ref: "#/components/schemas/FrontendSemester"

    FrontendConfigUpdate:
      type: object
      additionalProperties: false
      required: [features, display]
      properties:
        features:
          $ref: "#/components/schemas/FrontendFeatures"
        display:
          $ref: "#/components/schemas/FrontendDisplay"

    FrontendConfig:
      type: object
      additionalProperties: false
      required: [version, features, display, updated_at]
      properties:
        version:
          type: integer
          minimum: 1
        features:
          $ref: "#/components/schemas/FrontendFeatures"
        display:
          $ref: "#/components/schemas/FrontendDisplay"
        oauth:
          $ref: "#/components/schemas/FrontendOAuthAvailability"
        updated_at:
          type: string
          format: date-time

    FrontendOAuthAvailability:
      type: object
      additionalProperties: false
      description: >
        Read-only server capability: whether OAuth client credentials are configured for
        each provider. Derived from the environment, not stored, and ignored on write. The
        login page shows a button only when the panel switch and this are both true.
      required: [google, github]
      properties:
        google:
          type: boolean
        github:
          type: boolean

    RegisterRequest:
      type: object
      required: [email, password, code]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        code:
          type: string
          pattern: "^[0-9]{6}$"
        nickname:
          type: string
          maxLength: 80
        meter:
          type: string
          pattern: "^[0-9]{6,32}$"
          deprecated: true
          description: >
            Optional and deprecated. Registration creates the account only; the product
            frontend binds a meter after login through PUT /api/v1/me/meter, so an anonymous
            visitor can no longer turn a meter number into a dormitory address.

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
          description: Short-lived JWT; keep it in memory and send it as a Bearer token.
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.
          minimum: 60
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, email, nickname, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        nickname:
          type: string
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: [string, "null"]
          format: date-time
        has_password:
          type: boolean
          description: >
            False for accounts created through third-party login that have not set a
            password yet. Changing the password, changing the email and deleting the
            account all require one, and reply 409 `password_not_set` until it exists;
            password recovery sets the first one.
        oauth_providers:
          type: array
          description: Third-party identities linked to this account.
          items:
            type: string
            enum: [google, github]
        meter:
          oneOf:
            - $ref: "#/components/schemas/UserMeter"
            - type: "null"

    UserMeter:
      type: object
      required: [meter, campus, building, floor, room]
      properties:
        meter:
          type: string
        campus:
          type: string
        building:
          type: string
        floor:
          type: string
        room:
          type: string

    MeterPreview:
      type: object
      required: [meter, campus, building, floor, room, claimable]
      additionalProperties: false
      properties:
        meter:
          type: string
        campus:
          type: string
        building:
          type: string
        floor:
          type: string
        room:
          type: string
        claimable:
          type: boolean
        reason:
          type: [string, "null"]
          enum: [already_bound, excluded, unsupported_building, null]

    CampusScopes:
      type: object
      required: [updated_at, campuses]
      properties:
        updated_at:
          type: string
          format: date-time
        campuses:
          type: array
          items:
            type: object
            required: [name, buildings]
            properties:
