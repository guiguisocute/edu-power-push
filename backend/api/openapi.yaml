        scope_meters:
          type: integer
          description: 各桶日均非空房数的最大值，供客户端作兜底除数。
        availability:
          $ref: "#/components/schemas/Availability"
        quality:
          $ref: "#/components/schemas/Quality"
        points:
          type: array
          items:
            $ref: "#/components/schemas/SeriesPoint"

    DayNightSlice:
      type: object
      required: [kwh, hours, kwh_per_hour, intervals, days, purity]
      properties:
        kwh:
          $ref: "#/components/schemas/Decimal"
        hours:
          type: number
          description: 计入本侧的抄表区间总时长。白天与夜间的时长本来就不相等，比较强度必须用 kwh_per_hour。
        kwh_per_hour:
          $ref: "#/components/schemas/Decimal"
        intervals:
          type: integer
        days:
          type: integer
          description: 本侧覆盖了多少个不同的自然日。
        purity:
          type: number
          description: 计入时长中真正落在本侧窗口内的比例；1 = 抄表时间与 06:00/18:00 完全对齐。

    DayNightSplit:
      type: object
      required:
        [meter, from, to, timezone, day_window, night_window, day, night, skipped_intervals, availability]
      properties:
        meter:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        timezone:
          type: string
          example: Asia/Shanghai
        day_window:
          type: string
          example: "06:00-18:00"
        night_window:
          type: string
          example: "18:00-06:00"
        day:
          $ref: "#/components/schemas/DayNightSlice"
        night:
          $ref: "#/components/schemas/DayNightSlice"
        skipped_intervals:
          type: integer
          description: 横跨 06:00 / 18:00、时长过长或过短而无法归属的区间数。
        availability:
          $ref: "#/components/schemas/Availability"

    MonthlyBill:
      type: object
      required: [month, start_kwh, end_kwh, usage_kwh, cost_yuan]
      properties:
        month:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
        start_kwh:
          $ref: "#/components/schemas/Decimal"
        end_kwh:
          $ref: "#/components/schemas/Decimal"
        usage_kwh:
          $ref: "#/components/schemas/Decimal"
        cost_yuan:
          $ref: "#/components/schemas/Decimal"

    CampusSummary:
      type: object
      required:
        [scope, from, to, availability, quality, total_kwh, per_room_kwh]
      properties:
        scope:
          type: object
          additionalProperties:
            type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        total_kwh:
          oneOf:
            - $ref: "#/components/schemas/Decimal"
            - type: "null"
        per_room_kwh:
          oneOf:
            - $ref: "#/components/schemas/Decimal"
            - type: "null"
        meters:
          type: integer
          description: per_room_kwh 的除数 —— 查询窗口内逐日判定后的日均非空房数。
        availability:
          $ref: "#/components/schemas/Availability"
        quality:
          $ref: "#/components/schemas/Quality"

    RankingEntry:
      type: object
      required: [rank, label, is_self, value_kwh]
      description: >
        Identity is masked on the server. The rankings endpoint is anonymous, so plaintext
        building/floor/room are returned only for the caller's own row (is_self), and every
        other row carries just the pre-rendered label built from that meter owner's
        display/mask preferences. Meters whose owner opted out are absent entirely.
      properties:
        rank:
          type: integer
        label:
          type: string
          description: Server-rendered identity, e.g. "12栋 · 4楼" or "匿名参与"
          examples: ["12栋 · 4楼"]
        is_self:
          type: boolean
        building:
          type: [string, "null"]
          description: Plaintext, only when is_self is true
        floor:
          type: [string, "null"]
        room:
          type: [string, "null"]
        value_kwh:
          $ref: "#/components/schemas/Decimal"
          description: >
            usage/surge/drop 为周期总用量；saving 为“非空日平均用量 × 标准周期天数”
            （日=1、周=7、月=30），因此空房日既不参与也不会让低总量获得不公平优势。
        change_ratio:
          type: [number, "null"]

    LeaderboardPreference:
      type: object
      required:
        [opted_in, show_building, show_floor, show_room, show_nickname, mask_building, mask_floor, mask_room, updated_at]
      description: >
        Leaderboard participation and identity masking. Defaults for a meter without an account:
        opted in; building, floor and room shown and masked. Nickname hidden by default.
      properties:
        opted_in:
          type: boolean
          description: When false the meter never appears in campus/rankings
        show_building: { type: boolean }
        show_floor: { type: boolean }
        show_room: { type: boolean }
        show_nickname: { type: boolean }
        mask_building: { type: boolean }
        mask_floor: { type: boolean }
        mask_room: { type: boolean }
        updated_at: { type: string, format: date-time }

    Channel:
      type: object
      required: [channel, enabled, config, secret_set]
      properties:
        channel:
          type: string
          enum: [mail, sms, dingtalk, wecom, wecom_webhook, feishu, lark, discord, webhook, bark, gotify, whatsapp, pushplus, serverchan_turbo, serverchan3, mp, qq, napcat, telegram]
        enabled: { type: boolean }
        config:
          type: object
          description: Per-channel fields; secret values are masked or null on read.
          additionalProperties: true
        secret_set:
          type: object
          description: Which secret fields currently hold a stored value.
          additionalProperties: { type: boolean }
        last_result:
          oneOf:
            - $ref: "#/components/schemas/ChannelTestResult"
            - type: "null"
        updated_at: { type: string, format: date-time }

    ChannelUpdate:
      type: object
      required: [enabled, config]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        config:
          type: object
          description: Omit a secret field to keep the stored value; send null to clear it.
          additionalProperties: true

    ChannelList:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          items: { $ref: "#/components/schemas/Channel" }

    ChannelTestResult:
      type: object
      required: [status, at]
      properties:
        status: { type: string, enum: [ok, failed] }
        at: { type: string, format: date-time }
        message: { type: [string, "null"] }
        latency_ms: { type: [integer, "null"] }

    NotificationSettings:
      type: object
      required: [low_balance_alert, threshold_yuan, scheduled_digest, period, push_time]
      additionalProperties: false
      properties:
        low_balance_alert: { type: boolean }
        threshold_yuan:
          type: string
          pattern: "^(?:(?:[1-9]|[1-4][0-9])(?:\\.[0-9]{1,2})?|50(?:\\.0{1,2})?)$"
          default: "10"
          description: "Low-balance threshold in yuan, from 1 through 50"
        scheduled_digest: { type: boolean }
        period: { type: string, enum: [daily, twice, every3, weekly] }
        push_time: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        timezone: { type: string, default: "Asia/Shanghai" }
        templates:
          $ref: "#/components/schemas/NotificationTemplates"
          description: User-defined title and body templates applied only to non-email channels.
        updated_at: { type: string, format: date-time }

    NotificationTemplates:
      type: object
      additionalProperties: false
      properties:
        low_balance:
          $ref: "#/components/schemas/NotificationMessageTemplate"
        digest:
          $ref: "#/components/schemas/NotificationMessageTemplate"

    NotificationMessageTemplate:
      type: object
      required: [title, body]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 4000
      description: Go text/template text using documented fields such as {{.balance_yuan}} and {{.meter_number}}.

    PushLog:
      type: object
      required: [id, sent_at, channel, kind, status, summary]
      properties:
        id: { type: string, format: uuid }
        sent_at: { type: string, format: date-time }
        channel: { type: string }
        kind: { type: string, enum: [low_balance, digest, test, system] }
        status: { type: string, enum: [accepted, delivered, failed, skipped] }
        summary: { type: string }
        error: { type: [string, "null"] }

    PushLogPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PushLog" }
        next_cursor: { type: [string, "null"] }

    Ranking:
      type: object
      required: [period, mode, current_period, previous_period, updated_at, next_update_at, availability, quality, excluded_count, items]
      properties:
        period:
          type: string
          enum: [day, week, month]
        mode:
          type: string
          enum: [usage, saving, surge, drop]
        current_period:
          $ref: "#/components/schemas/RankingPeriod"
        previous_period:
          $ref: "#/components/schemas/RankingPeriod"
        updated_at:
          type: string
          format: date-time
          description: Scheduled boundary at which this completed-period snapshot became current.
        next_update_at:
          type: string
          format: date-time
          description: Next scheduled cache expiry and period switch.
        availability:
          $ref: "#/components/schemas/Availability"
        quality:
          $ref: "#/components/schemas/Quality"
        excluded_count:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/RankingEntry"
        self:
          oneOf:
            - $ref: "#/components/schemas/RankingSelf"
            - type: "null"
          description: >
            Present only for a signed-in caller with a bound meter that has usage in the period.
            The rank is computed over the whole population, so it is meaningful well outside the
            returned page — that number is derivable from the public board anyway, and hiding it
            only stops people from seeing themselves.

    RankingPeriod:
      type: object
      required: [from, to]
      description: Inclusive natural-date boundaries actually used to calculate the ranking.
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date

    RankingSelf:
      type: object
      required: [rank, total, percentile, label, value_kwh, in_list, neighbors]
      properties:
        rank:
          type: integer
        total:
          type: integer
          description: Size of the ranked population under the current filters.
        percentile:
          type: number
          format: double
          description: rank / total. Interpretation flips with mode (rank 1 is the heaviest user
            on the usage board and the lightest on the saving board).
        label:
          type: string
          description: Plaintext location; only ever sent to the owner.
        building:
          type: string
        floor:
          type: string
        room:
          type: string
        value_kwh:
          $ref: "#/components/schemas/Decimal"
        change_ratio:
          type: [number, "null"]
          format: double
        in_list:
          type: boolean
          description: Whether this rank already appears in `items`.
        neighbors:
          type: array
          description: One entry above and below (including self), so a bare "#137" has context.
            Neighbours stay masked according to their own preferences.
          items:
            $ref: "#/components/schemas/RankingEntry"

    CampusBills:
      type: object
      required: [months, source]
      properties:
        from_month:
          type: string
        to_month:
          type: string
        building:
          type: string
        months:
          type: array
          items:
            $ref: "#/components/schemas/CampusBillMonth"
        buildings:
          description: Per-building split of the last month in range.
          type: array
          items:
            $ref: "#/components/schemas/CampusBillBuilding"
        source:
          description: >
            Always `monthly_bill`. Marks these figures as the independent official monthly
            reconciliation source; /campus/series uses official daily detail where settled.
          type: string
          enum: [monthly_bill]

    CampusBillMonth:
      type: object
      required: [month, total_kwh, cost_yuan, meters, per_room_kwh]
      properties:
        month:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}$'
        total_kwh:
          $ref: "#/components/schemas/Decimal"
        cost_yuan:
          $ref: "#/components/schemas/Decimal"
        meters:
          description: >
            该月逐日判定后的日均非空房数。月度总量仍包含空房用量，户均除以此值。
          type: integer
        per_room_kwh:
          $ref: "#/components/schemas/Decimal"

    CampusBillBuilding:
      type: object
      required: [building, total_kwh, meters, share]
      properties:
        building:
          type: string
        total_kwh:
          $ref: "#/components/schemas/Decimal"
        meters:
          type: integer
        share:
          type: number
          format: double

    CampusBreakdown:
      type: object
      required: [group_by, granularity, buckets, total_kwh, max_cell_kwh, rows, availability, quality]
      properties:
        group_by:
          type: string
          enum: [building, floor]
        granularity:
          type: string
          enum: [day, week, month]
        buckets:
          type: array
          items:
            type: string
            format: date-time
        total_kwh:
          $ref: "#/components/schemas/Decimal"
        max_cell_kwh:
          $ref: "#/components/schemas/Decimal"
          description: Largest single cell; the heatmap normalises against it.
        rows:
          type: array
          items:
            $ref: "#/components/schemas/CampusBreakdownRow"
        availability:
          $ref: "#/components/schemas/Availability"
        quality:
          $ref: "#/components/schemas/Quality"

    CampusBreakdownRow:
      type: object
      required: [key, total_kwh, share, meters, meter_counts, values]
      properties:
        key:
          type: string
          description: Building name, or floor name when scoped to one building.
        total_kwh:
          $ref: "#/components/schemas/Decimal"
        share:
          type: number
          format: double
          description: Fraction of the scope total, 0..1.
        meters:
          type: integer
          description: >
            整个查询窗口的日均非空房数，用作行合计的户均除数。
        meter_counts:
          type: array
          description: 与 values 一一对应；每项是该时间桶内的日均非空房数。
          items:
            type: integer
            minimum: 0
        values:
          type: array
          description: Aligned one-to-one with `buckets`. null means no valid reading for that
            cell, which is not the same as zero consumption.
          items:
            oneOf:
              - $ref: "#/components/schemas/Decimal"
              - type: "null"

    AdminActor:
      type: object
      required: [user_id, label, role, via_token]
      properties:
        user_id:
          type: string
          description: Empty when authenticated with ADMIN_TOKEN.
        label:
          type: string
          description: Email for session auth, or "admin-token" for machine auth.
        role:
          type: string
          enum: [user, operator, admin]
        via_token:
          type: boolean

    AdminSession:
      type: object
      required: [actor, environment, version, secrets_ready, admin_count]
      properties:
        actor:
          $ref: "#/components/schemas/AdminActor"
        environment:
          type: string
          enum: [development, test, production]
        version:
          type: string
        secrets_ready:
          type: boolean
          description: >
            False when the server has no SETTINGS_ENCRYPTION_KEY. The panel warns up front
            rather than letting the user discover it when a save fails.
        admin_count:
          type: integer
          description: Active administrators. Zero means the first one still needs bootstrapping.

    AdminUser:
      type: object
      required:
        [id, email, nickname, role, status, created_at, active_sessions, place, channels_enabled]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        nickname: { type: string }
        role:
          type: string
          enum: [user, operator, admin]
        status:
          type: string
          enum: [active, disabled]
        created_at: { type: string, format: date-time }
        last_login_at: { type: [string, "null"], format: date-time }
        email_verified_at:
          type: [string, "null"]
          format: date-time
          description: Set when registration or an email change verifies ownership.
        active_sessions:
          type: integer
          description: Unrevoked, unexpired refresh sessions, i.e. roughly the number of devices.
        meter: { type: [string, "null"] }
        place: { type: string }
        channels_enabled: { type: integer }

    AuditEntry:
      type: object
      required: [id, actor_label, action, target, detail, request_id, created_at]
      properties:
        id: { type: string, format: uuid }
        actor_label: { type: string }
        action:
          type: string
          example: settings.mail.save
        target: { type: string }
        detail:
          type: object
          additionalProperties: true
          description: Metadata only. Credential values are never recorded here.
        request_id: { type: string }
        created_at: { type: string, format: date-time }

    ScannerSettings:
      type: object
      required: [shared, balance, bills, daily_details]
      properties:
        shared:
          $ref: "#/components/schemas/SharedUpstreamSettings"
        balance:
          $ref: "#/components/schemas/BalanceScannerSettings"
        bills:
          $ref: "#/components/schemas/BatchScannerSettings"
        daily_details:
          $ref: "#/components/schemas/DetailScannerSettings"

    SharedUpstreamSettings:
      type: object
      required: [qps, concurrency]
      description: >-
        The gate every collector passes through. It bounds the three scanners
        together, so it is the binding limit whenever their sum exceeds it.
      properties:
        qps: {type: number, format: double, exclusiveMinimum: 0}
        concurrency: {type: integer, minimum: 1}

    BatchScannerSettings:
      type: object
      required: [cron, qps, concurrency, retry_max, month_retry_max, enabled]
      properties:
        cron: {type: string, description: Five-field cron expression.}
        qps: {type: number, format: double, exclusiveMinimum: 0}
        concurrency: {type: integer, minimum: 1}
        retry_max: {type: integer, minimum: 0}
        month_retry_max: {type: integer, minimum: 0}
        enabled: {type: boolean, description: Disables scheduling but not manual runs.}

    BalanceScannerSettings:
      type: object
      required: [cron, bound_cron, qps, concurrency, retry_max, enabled]
      properties:
        cron: {type: string, description: Full-inventory five-field cron expression.}
        bound_cron: {type: string, description: Priority bound-meter five-field cron expression; empty disables it.}
        qps: {type: number, format: double, exclusiveMinimum: 0}
        concurrency: {type: integer, minimum: 1}
        retry_max: {type: integer, minimum: 0}
        enabled: {type: boolean, description: Disables both balance schedules but not manual runs.}

    DetailScannerSettings:
      allOf:
        - $ref: "#/components/schemas/BatchScannerSettings"
        - type: object
          required: [retry_cron, bootstrap_from, auto_bootstrap]
          properties:
            retry_cron:
              type: string
              description: Five-field cron for retrying only meters whose previous day is still unpublished; empty disables it.
            bootstrap_from:
              type: string
              pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
            auto_bootstrap: {type: boolean}

    SchoolBinding:
      type: object
      required: [area_id]
      properties:
        provider:
          type: string
          description: Registered upstream implementation. Empty picks the only one registered.
          example: bdfairy
        area_id:
          type: string
          maxLength: 64
          description: Upstream area id. Empty stops collection.
          example: "83"
        area_name:
          type: string
          maxLength: 120
          description: Display name only. Empty is filled in from the provider's list.
        base_url:
          type: string
          description: Upstream entry point. Empty uses the provider's own default.
    SchoolOption:
      type: object
      required: [id, name, balance, bill, detail]
      properties:
        id: { type: string, example: "83" }
        name: { type: string, example: 示例大学 }
        balance:
          type: boolean
          description: Balance readings were confirmed working for this school.
        bill:
          type: boolean
          description: Monthly bills were confirmed working for this school.
        detail:
          type: boolean
          description: Daily details were confirmed working for this school.
    SchoolProvider:
      type: object
      required: [name, display_name, default_base_url, schools]
      properties:
        name: { type: string, example: bdfairy }
        display_name: { type: string }
        default_base_url:
          type: string
          description: Empty means the deployment must supply an explicit base URL.
        schools:
          type: array
          description: Empty means this provider ships no list; the operator supplies an area id.
          items:
            $ref: "#/components/schemas/SchoolOption"
    SchoolSettingsView:
      type: object
      required: [providers, current, source, configured]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/SchoolProvider"
        current:
          $ref: "#/components/schemas/SchoolBinding"
        source:
          type: string
          enum: [env, panel]
        configured:
          type: boolean
          description: False means every collector is idle waiting for a school.
        updated_at: { type: string, format: date-time, nullable: true }
        updated_by: { type: string }
    ScannerSettingsView:
      type: object
      required: [settings, source, limits]
      properties:
        settings:
          $ref: "#/components/schemas/ScannerSettings"
        source:
          type: string
          enum: [env, panel]
          description: env means nothing has been saved from the panel yet.
        limits:
          type: object
          required: [shared, balance, bills, daily_details]
          properties:
            shared:
              $ref: "#/components/schemas/ScannerSafetyLimits"
            balance:
              $ref: "#/components/schemas/ScannerSafetyLimits"
            bills:
              $ref: "#/components/schemas/ScannerSafetyLimits"
            daily_details:
              $ref: "#/components/schemas/ScannerSafetyLimits"
        updated_at: { type: [string, "null"], format: date-time }
        updated_by: { type: string }

    ScannerSafetyLimits:
      type: object
      required: [max_qps, max_concurrency]
      properties:
        max_qps: {type: number, format: double}
        max_concurrency: {type: integer}

    MailSettings:
      type: object
      description: >
        The plaintext half of the mail configuration. Empty fields mean "fall back to the
        environment variable", not "clear this" — otherwise one careless save would take out the
        whole mail path.
      properties:
        provider:
          type: string
          enum: ["", resend, smtp, tencent_ses]
          description: Empty disables mail entirely.
        from: { type: string }
        admin_to: { type: string }
        base_url:
          type: string
          description: Link prefix inside emails. No domain is ever hard-coded in the code.
        reply_to: { type: string }
        smtp:
          type: object
          properties:
            host: { type: string }
            port: { type: integer }
            user: { type: string }
            tls_mode:
              type: string
              enum: [tls, starttls]
        tencent:
          type: object
          properties:
            secret_id: { type: string }
            region: { type: string }
            from_email: { type: string }
            template_id: { type: integer }

    MailSettingsView:
      type: object
      required:
        [
          settings,
          secret_set,
          secret_masked,
          source,
          effective_provider,
          missing,
          ready,
          secrets_writable,
          secrets_unreadable,
          providers,
        ]
      properties:
        settings:
          $ref: "#/components/schemas/MailSettings"
        secret_set:
          type: object
          additionalProperties: { type: boolean }
        secret_masked:
          type: object
          additionalProperties: { type: string }
          description: Masked as re_E9••••snE9 — enough to confirm which key it is, not enough
            to reconstruct it.
        source:
          type: string
          enum: [env, panel]
        effective_provider:
          type: string
          description: Provider actually in force after merging with environment variables.
        missing:
          type: array
          items: { type: string }
          description: What is still needed before mail can be sent. Empty means ready.
        ready: { type: boolean }
        secrets_writable:
          type: boolean
          description: False when SETTINGS_ENCRYPTION_KEY is absent.
        secrets_unreadable:
          type: boolean
          description: >
            Ciphertext exists but the current key cannot open it (the key was rotated).
            Reported explicitly so the panel never shows "not configured" for a stored
            credential — that reading would invite a save that wipes the real one.
        providers:
          type: array
          items: { type: string }
        updated_at: { type: [string, "null"], format: date-time }
        updated_by: { type: string }

    UnavailableCapability:
      type: object
      required: [availability, reason_code, message, quality]
      properties:
        availability:
          type: string
          const: unavailable
        reason_code:
          type: string
        message:
          type: string
        quality:
          $ref: "#/components/schemas/Quality"

    MailDelivery:
      type: object
      required: [id, provider, message_type, recipient_masked, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          enum: [smtp, tencent_ses]
        message_type:
          type: string
        recipient_masked:
          type: string
        status:
          type: string
          enum: [pending, sent, failed]
        created_at:
          type: string
          format: date-time
        sent_at:
          type: [string, "null"]
          format: date-time
