    get:
      tags: [Users]
      operationId: listCurrentUserMeterBills
      summary: List stored monthly bills for the authenticated user's bound meter
      security:
        - userAccessToken: []
      parameters:
        - name: from_month
          in: query
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}$"
        - name: to_month
          in: query
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}$"
