      operationId: cancelScanRun
      summary: Request cancellation of an in-flight balance scan run
      description: >
        Marks the run for cancellation and returns immediately. The worker
        notices on its next heartbeat, stops dispatching new meters, lets
        in-flight ones finish, and finalizes the run as `canceled`. A canceled
        run is terminal and is never auto-resumed, unlike `interrupted`.
