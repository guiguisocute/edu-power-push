    get:
      tags: [Users]
      operationId: listCurrentUserPushLogs
      summary: Recent push delivery history
      description: >-
        Newest first. Page through older entries with the opaque `next_cursor` from the
        previous response; a null cursor means there is nothing older.
      security:
        - userAccessToken: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 5 }
        - name: cursor
          in: query
          description: Opaque cursor returned as `next_cursor` by the previous page.
          schema: { type: string }
      responses:
        "200":
          description: Push history page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushLogPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me/overview:
    get:
      tags: [Users]
      operationId: getCurrentUserMeterOverview
      summary: Get balance and quality for the authenticated user's bound meter
      security:
        - userAccessToken: []
      responses:
        "200":
          description: Bound-meter overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeterOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: User has no active meter binding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/me/refresh:
    post:
      tags: [Users]
      operationId: refreshCurrentUserMeter
      summary: Fetch and store one on-demand upstream reading for the bound meter
      description: >
        The server enforces a 30-second per-meter cooldown. Single-meter refreshes run in
        their own upstream lane, so a campus scan or monthly reconciliation no longer blocks
        them. status upstream_unavailable now means what it says: the upstream returned no
        usable reading, or the refresh lane was saturated, and the last stored reading is
        returned instead.
      security:
        - userAccessToken: []
      responses:
        "200":
          description: Refresh attempted; inspect status for refreshed, cached, or degraded outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeterRefresh"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: User has no active meter binding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/me/series:
    get:
      tags: [Users]
      operationId: getCurrentUserMeterSeries
      summary: Get balance or consumption series for the authenticated user's bound meter
      security:
        - userAccessToken: []
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Granularity"
        - name: metric
          in: query
          required: true
          schema:
            type: string
            enum: [balance, consumption]
      responses:
        "200":
          description: Bound-meter time series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeSeries"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me/day-night:
    get:
      tags: [Users]
      operationId: getCurrentUserMeterDayNight
      summary: Split the bound meter's consumption into daytime and night-time
      description: |
        Derived from scan intervals (`consumption_deltas`), not from the official daily
        usage that `/me/series` returns: the upstream only refreshes a meter's cumulative
        reading about twice a day, so the finest split we can honestly offer is
        "between two readings".

        Each interval is labelled as a whole by the window that covers most of its
        duration; kWh are never split proportionally across the 06:00/18:00 boundary.
        `purity` reports how much of the counted duration really falls inside its window,
        and `availability` is `unavailable` / `insufficient_history` when the reading
        times do not line up well enough to support the comparison at all.
      security:
        - userAccessToken: []
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Daytime / night-time split for the bound meter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayNightSplit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

